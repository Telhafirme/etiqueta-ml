<script>
// âââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
//  CONTROL HELPERS
// âââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
function updateCtrlVal(id, val) {

// âââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
//  STATE
// âââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
let rawTxt = '';
let orders = [];
let controleData = [];

// âââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
//  STATUS
// âââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ

// âââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
//  ZPL UTILITIES
// âââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
function decodeFH(s) {
  // ZPL ^FH: _XX = UTF-8 byte in hex
  try {
    return decodeURIComponent(s.replace(/_([0-9a-fA-F]{2})/g, '%$1'));
  } catch { return s; }
}

function parseZPLBlocks(txt) {
  // Normalize line endings
  txt = txt.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const parts = txt.split(/\^XZ/i);
  const blocks = [];
  for (let raw of parts) {
    const xaIdx = raw.search(/\^XA/i);
    if (xaIdx === -1) continue;
    raw = raw.slice(xaIdx).trim();
    if (!raw) continue;
    const full = raw + '\n^XZ\n';
    blocks.push({
      raw: full,
      isShipping: /\^FD>:\d/.test(full),
      isDANFE: /DANFE/i.test(full)
    });
  }
  return blocks;
}

function groupOrders(blocks) {
  const result = [];
  let cur = null;
  for (const b of blocks) {
    if (b.isShipping) {
      if (cur) result.push(cur);
      cur = { shipping: b, danfe: null, info: extractInfo(b.raw), controle: null, danfeInfo: null };
    } else if (b.isDANFE && cur && !cur.danfe) {
      cur.danfe = b;
      cur.danfeInfo = extractDANFEInfo(b.raw);
    }
  }
  if (cur) result.push(cur);
  return result;
}

// âââ EXTRACT SHIPPING LABEL INFO âââââââââââââââââââââââââââââââ
// KEY FIX: use [^\n]* instead of [^\\]* so regex spans entire line
// and backtracks through multiple ^ commands to find the target pattern
function extractInfo(raw) {
  const fh = decodeFH;

  // Tracking barcode: ^FD>:47009656524
  const track = (raw.match(/\^FD>:(\d+)/) || [])[1] || '';

  // Shipment number (11+ digits next to "Pack ID: 20000")
  // Line: ^FO272,117^A0N,27,27^FD12857803633^FS
  const shipNum = (raw.match(/\^FO272,\d+[^\n]*\^FD(\d{10,})\^FS/) || [])[1] || track;

  // Recipient: first ^FH^FD after separator ^FO0,950^GB
  const rzone = raw.split(/\^FO0,950\^GB/)[1] || '';
  const recipRaw = (rzone.match(/\^FH\^FD([^\^]+)\^FS/) || rzone.match(/(?<!\^)\^FD([^\^]+)\^FS/) || [])[1] || '';
  const recipient = fh(recipRaw).replace(/\s*\([A-Z0-9]+\)\s*$/, '');

  // Address line yâ1030: ^FO30,1030^A0N,26,26^FB600,2,0,L^FH^FDEndereÃ§o...^FS
  const addrRaw = (raw.match(/\^FO30,1030[^\n]*\^FH\^FD([^\^]+)\^FS/) || [])[1] || '';
  const address = fh(addrRaw).replace(/^Endere.{1,3}o:\s*/i, '').trim();

  // CEP
  const cep = (raw.match(/\^FDCEP:\s*(\d+)/) || [])[1] || '';

  // City
  const cityRaw = (raw.match(/Cidade de destino:\s*([^\^]+)\^FS/) || [])[1] || '';
  const city = fh(cityRaw).trim();

  // Cluster of origin (e.g. FRJ02): ^FO20,156^A0N,45,45^FB210,1,0,C^FR^FDFRJ02^FS
  const cluster = (raw.match(/\^FO20,156[^\n]*\^FR\^FD([A-Z0-9]+)\^FS/) || [])[1] || '';

  // Destination hub (e.g. SRJ1): ^FO170,580^A0N,170,170^FB510,1,0,C^FDSRJ1^FS
  const dest = (raw.match(/\^FO170,580[^\n]*\^FD([A-Z0-9]+)\^FS/) || [])[1] || '';

  // Channel number: ^FO20,580^A0N,165,165^FB180,1,0,C^FR^FD2^FS
  const channel = (raw.match(/\^FO20,580[^\n]*\^FR\^FD(\d+)\^FS/) || [])[1] || '';

  // Route line: ^FO0,795^A0N,28,28^FB533,1,0,R^FDFRJ02 > SRJ1 > ^FS
  const routeRaw = (raw.match(/\^FO0,795[^\n]*\^FD([^\^]+)\^FS/) || [])[1] || '';

  // Sector: ^FO538,790^A0N,40,40^FDR35^FS
  const sector = ((raw.match(/\^FO538,790[^\n]*\^FD([^\^]+)\^FS/) || [])[1] || '').trim();

  // Full route string
  const route = (fh(routeRaw).replace(/\s*>\s*$/, '').trim() + (sector ? ' ' + sector : ''))
    .replace(/>/g, 'â').trim();

  // Date + NF: ^FDSAB 09/05/2026    NF: 69^FS
  const dateNFRaw = (raw.match(/\^FD((?:SAB|DOM|SEG|TER|QUA|QUI|SEX)\s+\d+\/\d+\/\d+[^\^]*NF:\s*\d+)/) || [])[1] || '';
  const nf = (dateNFRaw.match(/NF:\s*(\d+)/) || [])[1] || '';
  const dateStr = dateNFRaw.replace(/\s+NF:.*/, '').trim();

  // Dispatch: ^FH^FDDespachar: sex 8/mai, antes das 12:15 h^FS
  const dispRaw = (raw.match(/Despachar:\s*([^\^]+)\^FS/) || [])[1] || '';
  const dispatch = fh(dispRaw).trim();

  return { track, shipNum, recipient, address, cep, city,
           cluster, dest, channel, route, nf, dateStr, dispatch };
}

// âââ EXTRACT DANFE INFO âââââââââââââââââââââââââââââââââââââââââ
function extractDANFEInfo(raw) {
  // NF number: ^FH^FDN_c3_bamero  69/Serie 2^FS
  const nfMatch = raw.match(/N_c3_bamero\s+(\d+)\/Serie\s*(\d+)/i);
  const nfNum = nfMatch ? nfMatch[1] : '';
  const nfSerie = nfMatch ? nfMatch[2] : '';

  // Emission date: ^FH^FDEmiss_C3_A3o 08/05/2026^FS
  const emission = (raw.match(/Emiss_C3_A3o\s+(\d{2}\/\d{2}\/\d{4})/i) || [])[1] || '';

  // Chave de acesso (44 digits): ^FD31260552028364000183550020000000691502373446^FS
  const chave = (raw.match(/\^FD(\d{44})\^FS/) || [])[1] || '';

  // DestinatÃ¡rio
  const destRaw = (raw.match(/DESTINATARIO:\s*([^\^]+)\^FS/) || [])[1] || '';
  const dest = destRaw.trim();

  return { nfNum, nfSerie, emission, chave, dest };
}

// âââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
//  PDF CONTROLE PARSING
// âââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
async function parseControlePDF(file) {
  try {
    if (!window.pdfjsLib) return [];
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    const page = await pdf.getPage(1);
    const content = await page.getTextContent();

    // Items with position
    const items = content.items
      .map(i => ({ str: i.str.trim(), x: Math.round(i.transform[4]), y: Math.round(i.transform[5]) }))
      .filter(i => i.str.length > 0);

    // Sort topâbottom then leftâright
    items.sort((a, b) => b.y - a.y || a.x - b.x);
    const lines = items.map(i => i.str);

    // Determine page midX for column separation
    const xs = items.map(i => i.x);
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const midX = minX + (maxX - minX) * 0.45; // left column ends around 45% of page

    // Left column: order identification
    const leftItems = items.filter(i => i.x <= midX);
    // Right column: product names
    const rightItems = items.filter(i => i.x > midX);

    // Parse orders from left column
    const result = [];
    const leftLines = leftItems.map(i => i.str);

    for (let i = 0; i < leftLines.length; i++) {
      // UUID anchor: e.g. f56751ce-519f-50cd-9cd0-63945436afb7
      if (/^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}/i.test(leftLines[i])) {
        const o = { uuid: leftLines[i], packId: '', venda: '', customer: '', sku: '', qty: '', color: '', product: '' };
        for (let j = i + 1; j < Math.min(i + 15, leftLines.length); j++) {
          const s = leftLines[j];
          if (/^[a-f0-9]{8}-[a-f0-9]{4}/i.test(s)) break;
          if (/^Pack\s*ID:/i.test(s))     { o.packId   = s.replace(/^Pack\s*ID:\s*/i, '').trim(); }
          else if (/^Venda:/i.test(s))    { o.venda    = s.replace(/^Venda:\s*/i, '').trim(); }
          else if (/^SKU:/i.test(s))      { o.sku      = s.replace(/^SKU:\s*/i, '').trim(); }
          else if (/^Quantidade:/i.test(s)){ o.qty     = s.replace(/^Quantidade:\s*/i, '').trim(); }
          else if (/^Cor:/i.test(s))      { o.color    = s.replace(/^Cor:\s*/i, '').trim(); }
          else if (!o.customer && s.length > 3 &&
            !/^(IdentificaÃ§Ã£o|Produtos|Despachem|mercado)/i.test(s)) {
            o.customer = s;
          }
        }
        result.push(o);
      }
    }

    // Extract product names from right column
    // Product names = long lines not matching field labels or headers
    const productLines = rightItems
      .filter(i => {
        const s = i.str;
        return s.length > 15 &&
          !/^(IdentificaÃ§Ã£o|Produtos|SKU:|Quantidade:|Cor:|Despachem|NÃ£o demore|mercado)/i.test(s) &&
          !/^[a-f0-9]{8}-/i.test(s);
      })
      .map(i => i.str);

    // Assign product names to orders by index
    result.forEach((o, idx) => {
      o.product = productLines[idx] || '';
    });

    return result;
  } catch(e) {
    console.error('PDF parse error:', e);
    return [];
  }
}

//  MATCH CONTROLE â ORDERS
// âââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
function matchControle(orders, controle) {
  for (const o of orders) {
    const shipNum = o.info.shipNum; // e.g. "12857803633"
    const matched = controle.find(c =>
      c.packId && c.packId.includes(shipNum)
    );
    if (matched) o.controle = matched;
  }
}

//  DISPLAY CONTROLS (crop / scale â like Shopee tool)
// âââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
function applyDisplay() {
  const scale    = parseInt(document.getElementById('img-scale')?.value ?? 100) / 100;
  const cropTop  = parseInt(document.getElementById('img-top')?.value  ?? 0)   / 100;
  const cropBot  = parseInt(document.getElementById('img-bot')?.value  ?? 0)   / 100;
  const hasCrop  = cropTop > 0 || cropBot > 0;

  document.querySelectorAll('.label-wrap').forEach(wrap => {
    const img = wrap.querySelector('.label-img');
    if (!img) return;

    const applyNow = () => {
      // 1. Aplica escala
      img.style.width     = (scale * 100) + '%';
      img.style.height    = 'auto';
      img.style.display   = 'block';

      if (!hasCrop) {
        // Sem corte: remove restriÃ§Ãµes de altura
        wrap.style.height   = '';
        img.style.marginTop = '';
        return;
      }

      // 2. Com corte: lÃª dimensÃµes reais apÃ³s escala ser aplicada
      const imgH = img.offsetHeight || img.naturalHeight * (img.offsetWidth / (img.naturalWidth || 1));
      if (!imgH) return; // layout ainda nÃ£o pronto

      const topPx    = Math.round(imgH * cropTop);
      const visibleH = Math.max(20, Math.round(imgH * (1 - cropTop - cropBot)));

      wrap.style.height   = visibleH + 'px';
      img.style.marginTop = -topPx + 'px';
    };

    if (img.complete && img.naturalWidth) applyNow();
    else img.addEventListener('load', applyNow, { once: true });
  });
}

//  LABELARY RENDERING  (timeout 7s para nÃ£o travar a UI)
// âââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
async function renderZPL(zpl, width = 4, height = 8, dpmm = 8) {
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 7000);
    const res = await fetch(
      `https://api.labelary.com/v1/printers/${dpmm}dpmm/labels/${width}x${height}/0/`,
      {
        method: 'POST',
        headers: { 'Accept': 'image/png', 'Content-Type': 'application/x-www-form-urlencoded' },
        body: zpl,
        signal: ctrl.signal
      }
    );
    clearTimeout(timer);
    if (!res.ok) return null;
    const blob = await res.blob();
    return URL.createObjectURL(blob);
  } catch { return null; }
}

function dlFile(content, filename) {
  const blob = new Blob([content], { type: 'text/plain' });
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: filename });
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function dlImg(src, filename) {
  Object.assign(document.createElement('a'), { href: src, download: filename }).click();
}

//  RENDER BARCODE (JsBarcode)

function renderBarcode(selector, value) {
  if (!value || !window.JsBarcode) return;
  try {
    JsBarcode(selector, value, {
      format: 'CODE128',
      displayValue: false,
      width: 1.4,
      height: 55,
      margin: 0,
      background: '#ffffff',
      lineColor: '#000000'
    });
  } catch(e) { console.warn('Barcode error:', e); }
}

    window.addEventListener('load', function() {
      ${chaves.map((c, i) => c ? `try{JsBarcode('#pbc-${i}','${c}',{format:'CODE128',displayValue:false,width:1.4,height:55,margin:0});}catch(e){}` : '').join('\n')}
      setTimeout(function(){ window.print(); }, 400);
    });
  <\/script></body></html>`;
  return html;
}

function printOrder(idx) {
  const w = window.open('', '_blank', 'width=600,height=800');
  w.document.write(buildPrintHTML([orders[idx]]));
  w.document.close();
}

function printAll() {
  const w = window.open('', '_blank', 'width=600,height=800');
  w.document.write(buildPrintHTML(orders));
  w.document.close();
}

function dlAllZPL() {
  let all = '';
  orders.forEach(o => { all += o.shipping.raw; if (o.danfe) all += o.danfe.raw; });
  dlFile(all, 'ml-etiquetas-completo.txt');
}

//  FILE HANDLERS
// âââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
async function handleTXT(file) {
  document.getElementById('tfn').textContent = file.name;
  document.getElementById('tz').classList.add('loaded');
  rawTxt = await file.text();
  await processAll();
}

async function handlePDF(file) {
  document.getElementById('pfn').textContent = file.name;
  document.getElementById('pz').classList.add('loaded');
  setSt('Lendo PDF Controleâ¦', 'info');
  controleData = await parseControlePDF(file);
  console.log('Controle parsed:', controleData);
  if (rawTxt) await processAll();
}

async function processAll() {
  if (!rawTxt) return;
  setSt('Processando ZPLâ¦', 'info');
  try {
    const blocks = parseZPLBlocks(rawTxt);
    console.log('ZPL blocks found:', blocks.length, blocks.map(b => ({isShipping: b.isShipping, isDANFE: b.isDANFE})));
    orders = groupOrders(blocks);
    console.log('Orders grouped:', orders.length, orders.map(o => o.info));
    if (!orders.length) {
      setSt('Nenhum bloco ZPL reconhecido. Verifique o arquivo .txt.', 'err');
      return;
    }
    if (controleData.length) {
      matchControle(orders, controleData);
      console.log('Controle matched:', orders.map(o => o.controle));
    }
    await renderOrders();
  } catch(e) {
    setSt('Erro: ' + e.message, 'err');
    console.error(e);
  }
}

document.getElementById('tf').addEventListener('change', e => {
  if (e.target.files[0]) handleTXT(e.target.files[0]);
});
document.getElementById('pf').addEventListener('change', e => {
  if (e.target.files[0]) handlePDF(e.target.files[0]);
});

function setupDrop(zoneId, handler) {
  const zone = document.getElementById(zoneId);
  ['dragover','dragleave','drop'].forEach(ev => {
    zone.addEventListener(ev, e => {
      e.preventDefault();
      if (ev === 'dragover') zone.classList.add('drag');
      if (ev === 'dragleave') zone.classList.remove('drag');
      if (ev === 'drop' && e.dataTransfer.files[0]) {
        zone.classList.remove('drag');
        handler(e.dataTransfer.files[0]);
      }
    });
  });
}
setupDrop('tz', handleTXT);
setupDrop('pz', handlePDF);
