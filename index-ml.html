<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Etiqueta Mercado Livre — Eleva Commerce</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<style>
:root{
  --ml:#fff159;--ml2:#f5a623;--bg:#f4f4f4;--card:#fff;
  --text:#333;--muted:#777;--border:#e0e0e0;
  --ok:#27ae60;--err:#e74c3c;--info:#2980b9;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ── HEADER ── */
header{background:linear-gradient(135deg,#fff159 0%,#f5a623 100%);
  padding:22px 20px 18px;text-align:center;border-bottom:3px solid #e8990a}
.brand{font-size:11px;font-weight:700;letter-spacing:3px;color:#333;text-transform:uppercase}
.sub{font-size:10px;color:#555;letter-spacing:2px;margin-bottom:10px}
header h1{font-size:21px;font-weight:700;color:#333;margin-bottom:4px}
.desc{font-size:13px;color:#555}

/* ── LAYOUT ── */
main{max-width:780px;margin:0 auto;padding:20px}

/* ── UPLOAD ── */
.upload-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.uzone{border:2px dashed var(--border);border-radius:12px;padding:22px 16px;
  text-align:center;background:var(--card);transition:all .2s;cursor:pointer;position:relative}
.uzone:hover,.uzone.drag{border-color:var(--ml2);background:#fffdf0}
.uzone.loaded{border-color:var(--ok);background:#f0fff4}
.uzone .ico{font-size:30px;margin-bottom:8px}
.uzone p{font-size:13px;color:var(--muted);line-height:1.5}
.uzone .hint{font-size:11px;color:#aaa;margin-top:3px}
.uzone .fname{font-size:12px;font-weight:600;color:var(--ok);margin-top:5px}
.uzone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}

/* ── STATUS ── */
.st{display:none;border-radius:8px;padding:11px 15px;margin-bottom:14px;font-size:13px;align-items:center;gap:8px}
.st.show{display:flex}
.st.info{background:#eaf4fb;border-left:4px solid var(--info);color:var(--info)}
.st.ok{background:#eafaf1;border-left:4px solid var(--ok);color:#1e8449}
.st.err{background:#fdedec;border-left:4px solid var(--err);color:var(--err)}
.sp{display:inline-block;width:13px;height:13px;border:2px solid currentColor;
  border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── ORDER CARD ── */
.ocard{background:var(--card);border-radius:14px;overflow:hidden;margin-bottom:22px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);border:1px solid var(--border)}

.ohead{display:flex;align-items:center;gap:10px;padding:14px 16px;
  border-bottom:1px solid var(--border);flex-wrap:wrap;background:#fafafa}
.onum{background:linear-gradient(135deg,#fff159,#f5a623);color:#333;
  font-weight:700;font-size:12px;padding:3px 10px;border-radius:20px;white-space:nowrap}
.ohead h2{font-size:15px;font-weight:600;flex:1;min-width:0}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;
  font-family:monospace;white-space:nowrap}
.badge-route{background:#333;color:#fff}
.badge-dispatch{background:#fff3cd;color:#856404;border:1px solid #ffc107}

/* ── SHIPPING LABEL ── */
.lsection{border-bottom:1px solid var(--border)}
.lsection-hd{padding:8px 16px;font-size:11px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.5px;background:#f7f7f7;
  display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot-s{background:#27ae60}.dot-d{background:#3498db}
.label-img{width:100%;display:block;cursor:pointer}
.label-img:hover{opacity:.9}
.lload{padding:36px;text-align:center;color:#bbb;font-size:12px}

/* ── CHAVE / BARCODE ── */
.bc-section{border-bottom:1px solid var(--border);padding:14px 16px;text-align:center;background:#fdfdfd}
.bc-hd{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:10px}
.bc-svg{width:100%;max-width:560px;height:60px}
.chave-num{font-family:monospace;font-size:10px;color:#888;margin-top:5px;
  letter-spacing:1px;word-break:break-all}

/* ── PRODUTO ── */
.prod-section{border-bottom:1px solid var(--border);padding:14px 16px;background:#fffdf5}
.prod-hd{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:8px}
.prod-name{font-size:14px;font-weight:600;color:var(--text);margin-bottom:6px;line-height:1.4}
.prod-meta{display:flex;flex-wrap:wrap;gap:6px}
.prod-tag{background:#f0f0f0;border-radius:6px;padding:4px 9px;font-size:12px;color:#555}
.prod-tag.sku{background:#fff3e0;border:1px solid #f5a623}
.prod-tag.sku strong{color:#c0392b;font-family:monospace}

/* ── ACTIONS ── */
.actions{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;background:#fafafa}
.btn{border:none;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:600;
  cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:all .15s;line-height:1.3}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(0,0,0,.12)}
.btn-ml{background:linear-gradient(135deg,#fff159,#f5a623);color:#333}
.btn-sec{background:#f0f0f0;color:#444}
.btn-out{background:transparent;border:1.5px solid var(--border);color:#555}

/* ── GLOBAL ACTIONS ── */
.gactions{display:flex;gap:10px;justify-content:center;padding:16px 0 10px;flex-wrap:wrap}

/* ── PRINT ── */
@media print{
  header,.upload-row,.st,.actions,.gactions,.lsection-hd,.bc-hd,.prod-hd{display:none!important}
  body{background:#fff}
  .ocard{box-shadow:none;border:none;page-break-after:always;border-radius:0}
}
@media(max-width:600px){
  .upload-row{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>
  <div class="brand">ELEVA COMMERCE</div>
  <div class="sub">GESTÃO DE MARKETPLACES</div>
  <h1>🏷️ Etiqueta Mercado Livre</h1>
  <p class="desc">Carrega o <strong>.txt</strong> de envio e o <strong>Controle.pdf</strong> · 1 bloco por pedido: etiqueta + chave NF + produto</p>
</header>

<main>
  <div class="upload-row">
    <div class="uzone" id="tz" onclick="document.getElementById('tf').click()">
      <div class="ico">📂</div>
      <p><strong>Arraste ou clique</strong><br>Etiqueta de envio <strong>.txt</strong></p>
      <div class="fname" id="tfn"></div>
      <input type="file" id="tf" accept=".txt">
    </div>
    <div class="uzone" id="pz" onclick="document.getElementById('pf').click()">
      <div class="ico">📋</div>
      <p><strong>Arraste ou clique</strong><br><strong>Controle.pdf</strong></p>
      <p class="hint">opcional — SKU e produto</p>
      <div class="fname" id="pfn"></div>
      <input type="file" id="pf" accept=".pdf">
    </div>
  </div>

  <div class="st" id="st"></div>
  <div id="orders"></div>
  <div class="gactions" id="ga"></div>
</main>

<script>
// ═══════════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════════
let rawTxt = '';
let orders = [];
let controleData = [];

// ═══════════════════════════════════════════════════════════════
//  STATUS
// ═══════════════════════════════════════════════════════════════
function setSt(msg, type='info') {
  const el = document.getElementById('st');
  el.className = `st show ${type}`;
  el.innerHTML = (type==='info' ? '<span class="sp"></span> ' : '') + msg;
}
function hideSt() { document.getElementById('st').className = 'st'; }

// ═══════════════════════════════════════════════════════════════
//  ZPL UTILITIES
// ═══════════════════════════════════════════════════════════════
function decodeFH(s) {
  // ZPL ^FH: _XX = UTF-8 byte in hex
  try {
    return decodeURIComponent(s.replace(/_([0-9a-fA-F]{2})/g, '%$1'));
  } catch { return s; }
}

function parseZPLBlocks(txt) {
  // Normalize line endings
  txt = txt.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const parts = txt.split(/\^XZ/i);
  const blocks = [];
  for (let raw of parts) {
    const xaIdx = raw.search(/\^XA/i);
    if (xaIdx === -1) continue;
    raw = raw.slice(xaIdx).trim();
    if (!raw) continue;
    const full = raw + '\n^XZ\n';
    blocks.push({
      raw: full,
      isShipping: /\^FD>:\d/.test(full),
      isDANFE: /DANFE/i.test(full)
    });
  }
  return blocks;
}

function groupOrders(blocks) {
  const result = [];
  let cur = null;
  for (const b of blocks) {
    if (b.isShipping) {
      if (cur) result.push(cur);
      cur = { shipping: b, danfe: null, info: extractInfo(b.raw), controle: null, danfeInfo: null };
    } else if (b.isDANFE && cur && !cur.danfe) {
      cur.danfe = b;
      cur.danfeInfo = extractDANFEInfo(b.raw);
    }
  }
  if (cur) result.push(cur);
  return result;
}

// ─── EXTRACT SHIPPING LABEL INFO ───────────────────────────────
// KEY FIX: use [^\n]* instead of [^\^]* so regex spans entire line
// and backtracks through multiple ^ commands to find the target pattern
function extractInfo(raw) {
  const fh = decodeFH;

  // Tracking barcode: ^FD>:47009656524
  const track = (raw.match(/\^FD>:(\d+)/) || [])[1] || '';

  // Shipment number (11+ digits next to "Pack ID: 20000")
  // Line: ^FO272,117^A0N,27,27^FD12857803633^FS
  const shipNum = (raw.match(/\^FO272,\d+[^\n]*\^FD(\d{10,})\^FS/) || [])[1] || track;

  // Recipient: first ^FH^FD after separator ^FO0,950^GB
  const rzone = raw.split(/\^FO0,950\^GB/)[1] || '';
  const recipRaw = (rzone.match(/\^FH\^FD([^\^]+)\^FS/) || rzone.match(/(?<!\^)\^FD([^\^]+)\^FS/) || [])[1] || '';
  const recipient = fh(recipRaw).replace(/\s*\([A-Z0-9]+\)\s*$/, '');

  // Address line y≈1030: ^FO30,1030^A0N,26,26^FB600,2,0,L^FH^FDEndereço...^FS
  const addrRaw = (raw.match(/\^FO30,1030[^\n]*\^FH\^FD([^\^]+)\^FS/) || [])[1] || '';
  const address = fh(addrRaw).replace(/^Endere.{1,3}o:\s*/i, '').trim();

  // CEP
  const cep = (raw.match(/\^FDCEP:\s*(\d+)/) || [])[1] || '';

  // City
  const cityRaw = (raw.match(/Cidade de destino:\s*([^\^]+)\^FS/) || [])[1] || '';
  const city = fh(cityRaw).trim();

  // Cluster of origin (e.g. FRJ02): ^FO20,156^A0N,45,45^FB210,1,0,C^FR^FDFRJ02^FS
  const cluster = (raw.match(/\^FO20,156[^\n]*\^FR\^FD([A-Z0-9]+)\^FS/) || [])[1] || '';

  // Destination hub (e.g. SRJ1): ^FO170,580^A0N,170,170^FB510,1,0,C^FDSRJ1^FS
  const dest = (raw.match(/\^FO170,580[^\n]*\^FD([A-Z0-9]+)\^FS/) || [])[1] || '';

  // Channel number: ^FO20,580^A0N,165,165^FB180,1,0,C^FR^FD2^FS
  const channel = (raw.match(/\^FO20,580[^\n]*\^FR\^FD(\d+)\^FS/) || [])[1] || '';

  // Route line: ^FO0,795^A0N,28,28^FB533,1,0,R^FDFRJ02 > SRJ1 > ^FS
  const routeRaw = (raw.match(/\^FO0,795[^\n]*\^FD([^\^]+)\^FS/) || [])[1] || '';

  // Sector: ^FO538,790^A0N,40,40^FDR35^FS
  const sector = ((raw.match(/\^FO538,790[^\n]*\^FD([^\^]+)\^FS/) || [])[1] || '').trim();

  // Full route string
  const route = (fh(routeRaw).replace(/\s*>\s*$/, '').trim() + (sector ? ' ' + sector : ''))
    .replace(/>/g, '→').trim();

  // Date + NF: ^FDSAB 09/05/2026    NF: 69^FS
  const dateNFRaw = (raw.match(/\^FD((?:SAB|DOM|SEG|TER|QUA|QUI|SEX)\s+\d+\/\d+\/\d+[^\^]*NF:\s*\d+)/) || [])[1] || '';
  const nf = (dateNFRaw.match(/NF:\s*(\d+)/) || [])[1] || '';
  const dateStr = dateNFRaw.replace(/\s+NF:.*/, '').trim();

  // Dispatch: ^FH^FDDespachar: sex 8/mai, antes das 12:15 h^FS
  const dispRaw = (raw.match(/Despachar:\s*([^\^]+)\^FS/) || [])[1] || '';
  const dispatch = fh(dispRaw).trim();

  return { track, shipNum, recipient, address, cep, city,
           cluster, dest, channel, route, nf, dateStr, dispatch };
}

// ─── EXTRACT DANFE INFO ─────────────────────────────────────────
function extractDANFEInfo(raw) {
  // NF number: ^FH^FDN_c3_bamero  69/Serie 2^FS
  const nfMatch = raw.match(/N_c3_bamero\s+(\d+)\/Serie\s*(\d+)/i);
  const nfNum = nfMatch ? nfMatch[1] : '';
  const nfSerie = nfMatch ? nfMatch[2] : '';

  // Emission date: ^FH^FDEmiss_C3_A3o 08/05/2026^FS
  const emission = (raw.match(/Emiss_C3_A3o\s+(\d{2}\/\d{2}\/\d{4})/i) || [])[1] || '';

  // Chave de acesso (44 digits): ^FD31260552028364000183550020000000691502373446^FS
  const chave = (raw.match(/\^FD(\d{44})\^FS/) || [])[1] || '';

  // Destinatário
  const destRaw = (raw.match(/DESTINATARIO:\s*([^\^]+)\^FS/) || [])[1] || '';
  const dest = destRaw.trim();

  return { nfNum, nfSerie, emission, chave, dest };
}

// ═══════════════════════════════════════════════════════════════
//  PDF CONTROLE PARSING
// ═══════════════════════════════════════════════════════════════
async function parseControlePDF(file) {
  try {
    if (!window.pdfjsLib) return [];
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    const page = await pdf.getPage(1);
    const content = await page.getTextContent();

    // Items with position
    const items = content.items
      .map(i => ({ str: i.str.trim(), x: Math.round(i.transform[4]), y: Math.round(i.transform[5]) }))
      .filter(i => i.str.length > 0);

    // Sort top→bottom then left→right
    items.sort((a, b) => b.y - a.y || a.x - b.x);
    const lines = items.map(i => i.str);

    // Determine page midX for column separation
    const xs = items.map(i => i.x);
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const midX = minX + (maxX - minX) * 0.45; // left column ends around 45% of page

    // Left column: order identification
    const leftItems = items.filter(i => i.x <= midX);
    // Right column: product names
    const rightItems = items.filter(i => i.x > midX);

    // Parse orders from left column
    const result = [];
    const leftLines = leftItems.map(i => i.str);

    for (let i = 0; i < leftLines.length; i++) {
      // UUID anchor: e.g. f56751ce-519f-50cd-9cd0-63945436afb7
      if (/^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}/i.test(leftLines[i])) {
        const o = { uuid: leftLines[i], packId: '', venda: '', customer: '', sku: '', qty: '', color: '', product: '' };
        for (let j = i + 1; j < Math.min(i + 15, leftLines.length); j++) {
          const s = leftLines[j];
          if (/^[a-f0-9]{8}-[a-f0-9]{4}/i.test(s)) break;
          if (/^Pack\s*ID:/i.test(s))     { o.packId   = s.replace(/^Pack\s*ID:\s*/i, '').trim(); }
          else if (/^Venda:/i.test(s))    { o.venda    = s.replace(/^Venda:\s*/i, '').trim(); }
          else if (/^SKU:/i.test(s))      { o.sku      = s.replace(/^SKU:\s*/i, '').trim(); }
          else if (/^Quantidade:/i.test(s)){ o.qty     = s.replace(/^Quantidade:\s*/i, '').trim(); }
          else if (/^Cor:/i.test(s))      { o.color    = s.replace(/^Cor:\s*/i, '').trim(); }
          else if (!o.customer && s.length > 3 &&
            !/^(Identificação|Produtos|Despachem|mercado)/i.test(s)) {
            o.customer = s;
          }
        }
        result.push(o);
      }
    }

    // Extract product names from right column
    // Product names = long lines not matching field labels or headers
    const productLines = rightItems
      .filter(i => {
        const s = i.str;
        return s.length > 15 &&
          !/^(Identificação|Produtos|SKU:|Quantidade:|Cor:|Despachem|Não demore|mercado)/i.test(s) &&
          !/^[a-f0-9]{8}-/i.test(s);
      })
      .map(i => i.str);

    // Assign product names to orders by index
    result.forEach((o, idx) => {
      o.product = productLines[idx] || '';
    });

    return result;
  } catch(e) {
    console.error('PDF parse error:', e);
    return [];
  }
}

// ═══════════════════════════════════════════════════════════════
//  MATCH CONTROLE → ORDERS
// ═══════════════════════════════════════════════════════════════
function matchControle(orders, controle) {
  for (const o of orders) {
    const shipNum = o.info.shipNum; // e.g. "12857803633"
    const matched = controle.find(c =>
      c.packId && c.packId.includes(shipNum)
    );
    if (matched) o.controle = matched;
  }
}

// ═══════════════════════════════════════════════════════════════
//  LABELARY RENDERING
// ═══════════════════════════════════════════════════════════════
async function renderZPL(zpl, width = 4, height = 8, dpmm = 8) {
  try {
    const res = await fetch(
      `https://api.labelary.com/v1/printers/${dpmm}dpmm/labels/${width}x${height}/0/`,
      {
        method: 'POST',
        headers: { 'Accept': 'image/png', 'Content-Type': 'application/x-www-form-urlencoded' },
        body: zpl
      }
    );
    if (!res.ok) return null;
    const blob = await res.blob();
    return URL.createObjectURL(blob);
  } catch { return null; }
}

// ═══════════════════════════════════════════════════════════════
//  DOWNLOAD HELPERS
// ═══════════════════════════════════════════════════════════════
function dlFile(content, filename) {
  const blob = new Blob([content], { type: 'text/plain' });
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: filename });
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function dlImg(src, filename) {
  Object.assign(document.createElement('a'), { href: src, download: filename }).click();
}

// ═══════════════════════════════════════════════════════════════
//  RENDER BARCODE (JsBarcode)
// ═══════════════════════════════════════════════════════════════
function renderBarcode(selector, value) {
  if (!value || !window.JsBarcode) return;
  try {
    JsBarcode(selector, value, {
      format: 'CODE128',
      displayValue: false,
      width: 1.4,
      height: 55,
      margin: 0,
      background: '#ffffff',
      lineColor: '#000000'
    });
  } catch(e) { console.warn('Barcode error:', e); }
}

// ═══════════════════════════════════════════════════════════════
//  UI RENDERING
// ═══════════════════════════════════════════════════════════════
async function renderOrders() {
  const container = document.getElementById('orders');
  const ga = document.getElementById('ga');
  container.innerHTML = '';
  ga.innerHTML = '';
  if (!orders.length) return;

  setSt(`Renderizando ${orders.length} pedido(s) via Labelary…`, 'info');

  for (let idx = 0; idx < orders.length; idx++) {
    const o = orders[idx];
    const { info, controle: ctrl, danfeInfo } = o;
    const chave = danfeInfo?.chave || '';

    const card = document.createElement('div');
    card.className = 'ocard';
    card.id = `order-${idx}`;

    const routeBadge = (info.cluster && info.dest)
      ? `<span class="badge badge-route">${info.cluster} → ${info.dest}</span>` : '';
    const dispBadge = info.dispatch
      ? `<span class="badge badge-dispatch">⏰ ${info.dispatch}</span>` : '';
    const recipientDisplay = info.recipient || ctrl?.customer || `Pedido ${idx + 1}`;

    // Produto section
    const hasProd = ctrl && (ctrl.product || ctrl.sku);
    const prodHtml = hasProd ? `
      <div class="prod-section">
        <div class="prod-hd">📦 Produto</div>
        ${ctrl.product ? `<div class="prod-name">${ctrl.product}</div>` : ''}
        <div class="prod-meta">
          ${ctrl.sku   ? `<span class="prod-tag sku">SKU: <strong>${ctrl.sku}</strong></span>` : ''}
          ${ctrl.qty   ? `<span class="prod-tag">Qtd: <strong>${ctrl.qty}</strong></span>` : ''}
          ${ctrl.color ? `<span class="prod-tag">Cor: <strong>${ctrl.color}</strong></span>` : ''}
        </div>
      </div>` : '';

    // Chave barcode section
    const bcHtml = chave ? `
      <div class="bc-section">
        <div class="bc-hd">Chave de Acesso NF-e</div>
        <svg id="bc-${idx}" class="bc-svg"></svg>
        <div class="chave-num">${chave}</div>
      </div>` : '';

    card.innerHTML = `
      <div class="ohead">
        <span class="onum">Pedido ${idx + 1}</span>
        <h2>${recipientDisplay}</h2>
        ${routeBadge}
        ${dispBadge}
      </div>
      <div class="lsection">
        <div class="lsection-hd"><span class="dot dot-s"></span> Etiqueta de Envio</div>
        <div class="lload" id="sl-${idx}"><span class="sp"></span> Carregando via Labelary…</div>
      </div>
      ${bcHtml}
      ${prodHtml}
      <div class="actions">
        <button class="btn btn-ml" onclick="printOrder(${idx})">🖨️ Imprimir</button>
        <button class="btn btn-sec" onclick="dlFile(orders[${idx}].shipping.raw,'envio-pedido${idx+1}.txt')">⬇ TXT Envio</button>
        ${o.danfe ? `<button class="btn btn-sec" onclick="dlFile(orders[${idx}].danfe.raw,'danfe-pedido${idx+1}.txt')">⬇ TXT DANFE</button>` : ''}
        <button class="btn btn-out" onclick="dlFile(orders[${idx}].shipping.raw+(orders[${idx}].danfe?orders[${idx}].danfe.raw:''),'pedido${idx+1}-completo.txt')">⬇ TXT Completo</button>
      </div>`;

    container.appendChild(card);

    // Render shipping label via Labelary
    const shippingUrl = await renderZPL(o.shipping.raw, 4, 8, 8);
    const sl = document.getElementById(`sl-${idx}`);
    if (shippingUrl) {
      o.shippingUrl = shippingUrl;
      sl.outerHTML = `<img class="label-img" src="${shippingUrl}" alt="Etiqueta de envio"
        onclick="dlImg('${shippingUrl}','envio-pedido${idx+1}.png')" title="Clique para baixar PNG">`;
    } else {
      sl.innerHTML = '⚠️ Preview indisponível — Labelary offline. Use o arquivo ZPL.';
    }

    // Render chave barcode
    if (chave) {
      renderBarcode(`#bc-${idx}`, chave);
    }
  }

  ga.innerHTML = `
    <button class="btn btn-ml" onclick="printAll()">🖨️ Imprimir todos</button>
    <button class="btn btn-sec" onclick="dlAllZPL()">⬇ Baixar todos (.txt)</button>`;

  setSt(`✅ ${orders.length} pedido(s) carregado(s)`, 'ok');
}

// ═══════════════════════════════════════════════════════════════
//  PRINT
// ═══════════════════════════════════════════════════════════════
function buildPrintHTML(orderList) {
  let html = `<!DOCTYPE html><html><head><meta charset="UTF-8">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"><\/script>
  <style>
    body{margin:0;padding:8px;font-family:Arial,sans-serif;background:#fff}
    .order-block{page-break-after:always;padding:4px}
    img{width:100%;max-width:420px;display:block;margin:0 auto}
    .bc-wrap{text-align:center;margin:10px 0;padding:8px;border:1px solid #ddd;border-radius:6px}
    .bc-num{font-family:monospace;font-size:9px;color:#888;margin-top:4px;word-break:break-all}
    .prod-wrap{margin:8px 0;padding:10px;border:1px solid #ddd;border-radius:6px;background:#fffdf5}
    .prod-name{font-size:13px;font-weight:bold;margin-bottom:4px}
    .prod-meta{font-size:12px;color:#555}
    svg.bc-print{width:100%;max-width:420px;height:55px}
  </style></head><body>`;

  orderList.forEach((o, idx) => {
    const chave = o.danfeInfo?.chave || '';
    const ctrl = o.controle;
    const bcId = `pbc-${idx}`;
    html += `<div class="order-block">`;
    if (o.shippingUrl) html += `<img src="${o.shippingUrl}" alt="Etiqueta">`;
    if (chave) {
      html += `<div class="bc-wrap">
        <svg id="${bcId}" class="bc-print"></svg>
        <div class="bc-num">${chave}</div>
      </div>`;
    }
    if (ctrl && (ctrl.product || ctrl.sku)) {
      html += `<div class="prod-wrap">
        ${ctrl.product ? `<div class="prod-name">${ctrl.product}</div>` : ''}
        <div class="prod-meta">
          ${ctrl.sku ? `SKU: <strong>${ctrl.sku}</strong>` : ''}
          ${ctrl.qty ? ` &nbsp;|&nbsp; Qtd: <strong>${ctrl.qty}</strong>` : ''}
          ${ctrl.color ? ` &nbsp;|&nbsp; Cor: <strong>${ctrl.color}</strong>` : ''}
        </div>
      </div>`;
    }
    html += `</div>`;
  });

  // Inline barcode init script
  const chaves = orderList.map(o => o.danfeInfo?.chave || '');
  html += `<script>
    window.addEventListener('load', function() {
      ${chaves.map((c, i) => c ? `try{JsBarcode('#pbc-${i}','${c}',{format:'CODE128',displayValue:false,width:1.4,height:55,margin:0});}catch(e){}` : '').join('\n')}
      setTimeout(function(){ window.print(); }, 400);
    });
  <\/script></body></html>`;
  return html;
}

function printOrder(idx) {
  const w = window.open('', '_blank', 'width=600,height=800');
  w.document.write(buildPrintHTML([orders[idx]]));
  w.document.close();
}

function printAll() {
  const w = window.open('', '_blank', 'width=600,height=800');
  w.document.write(buildPrintHTML(orders));
  w.document.close();
}

function dlAllZPL() {
  let all = '';
  orders.forEach(o => { all += o.shipping.raw; if (o.danfe) all += o.danfe.raw; });
  dlFile(all, 'ml-etiquetas-completo.txt');
}

// ═══════════════════════════════════════════════════════════════
//  FILE HANDLERS
// ═══════════════════════════════════════════════════════════════
async function handleTXT(file) {
  document.getElementById('tfn').textContent = file.name;
  document.getElementById('tz').classList.add('loaded');
  rawTxt = await file.text();
  await processAll();
}

async function handlePDF(file) {
  document.getElementById('pfn').textContent = file.name;
  document.getElementById('pz').classList.add('loaded');
  setSt('Lendo PDF Controle…', 'info');
  controleData = await parseControlePDF(file);
  console.log('Controle parsed:', controleData);
  if (rawTxt) await processAll();
}

async function processAll() {
  if (!rawTxt) return;
  setSt('Processando ZPL…', 'info');
  try {
    const blocks = parseZPLBlocks(rawTxt);
    console.log('ZPL blocks found:', blocks.length, blocks.map(b => ({isShipping: b.isShipping, isDANFE: b.isDANFE})));
    orders = groupOrders(blocks);
    console.log('Orders grouped:', orders.length, orders.map(o => o.info));
    if (!orders.length) {
      setSt('Nenhum bloco ZPL reconhecido. Verifique o arquivo .txt.', 'err');
      return;
    }
    if (controleData.length) {
      matchControle(orders, controleData);
      console.log('Controle matched:', orders.map(o => o.controle));
    }
    await renderOrders();
  } catch(e) {
    setSt('Erro: ' + e.message, 'err');
    console.error(e);
  }
}

// ═══════════════════════════════════════════════════════════════
//  EVENT LISTENERS
// ═══════════════════════════════════════════════════════════════
document.getElementById('tf').addEventListener('change', e => {
  if (e.target.files[0]) handleTXT(e.target.files[0]);
});
document.getElementById('pf').addEventListener('change', e => {
  if (e.target.files[0]) handlePDF(e.target.files[0]);
});

function setupDrop(zoneId, handler) {
  const zone = document.getElementById(zoneId);
  ['dragover','dragleave','drop'].forEach(ev => {
    zone.addEventListener(ev, e => {
      e.preventDefault();
      if (ev === 'dragover') zone.classList.add('drag');
      if (ev === 'dragleave') zone.classList.remove('drag');
      if (ev === 'drop' && e.dataTransfer.files[0]) {
        zone.classList.remove('drag');
        handler(e.dataTransfer.files[0]);
      }
    });
  });
}
setupDrop('tz', handleTXT);
setupDrop('pz', handlePDF);
</script>
